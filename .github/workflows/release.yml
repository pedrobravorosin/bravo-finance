name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão (ex.: v1.0.1)"
        required: true
permissions:
  contents: write
jobs:
  pacotes:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --only-binary=:all: -r app/requirements.txt
      - run: python -m unittest discover tests -v
      - run: bash ferramentas/empacotar.sh
      - name: Publicar na página de Releases
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Financeiro $TAG" --generate-notes
          fi
